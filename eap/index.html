<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>东方领导力 EAP 深度学习报告 V3</title>
<style>html,body{margin:0;min-height:100%;background:#183A35}#loading{min-height:100vh;display:grid;place-items:center;color:#efe9dd;font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.04em}</style>
</head>
<body>
<div id="loading">正在加载深度学习报告…</div>
<script src="./chunk0.js"></script>
<script src="./chunk1.js"></script>
<script src="./chunk2.js"></script>
<script src="./chunk3.js"></script>
<script src="./chunk4.js"></script>
<script src="./chunk5.js"></script>
<script src="./chunk6.js"></script>
<script>
(async()=>{
  try{
    const b64=window.__EAP||"";
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById("loading").textContent="页面加载失败，请刷新重试。";
    console.error(e);
  }
})();
</script>
</body>
</html>
